apiVersion: batch/v1
kind: Job
metadata:
  name: failed-job
spec:
  completions: 1
  activeDeadlineSeconds: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/name: failed-job
    spec:
      restartPolicy: Never
      containers:
        - name: failed-job
          image: busybox
          args:
            - sleep
            - "60"