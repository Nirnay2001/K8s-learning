apiVersion: batch/v1
kind: Job
metadata:
  name: job-sleep-demo
spec:
  completions: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: job-sleep-demo
    spec:
      restartPolicy: Never
      containers:
        - name: job-sleep-demo
          image: busybox
          args:
            - sleep 
            - "10"