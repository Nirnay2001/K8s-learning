apiVersion: batch/v1
kind: Job
metadata:
  name: cleanup-jobs
spec:
  completions: 5
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanup-jobs
    spec:
      restartPolicy: Never
      containers:
        - name: cleanup-jobs
          image: busybox
          args:
            - sleep
            - "10"